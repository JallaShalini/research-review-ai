services:
  app:
    build: .
    container_name: research_agent_app
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./output:/app/output
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import sys; sys.exit(0)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
    command: [ "tail", "-f", "/dev/null" ]

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull llama3.1:8b || exit 1
        wait "$$server_pid"
    healthcheck:
      test: [ "CMD-SHELL", "ollama show llama3.1:8b >/dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m
    restart: unless-stopped

volumes:
  ollama_data:
